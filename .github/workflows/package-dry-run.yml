# Builds the add-on package without uploading it, for checking what a release would contain
# (the minimap libraries fetched from .pkgmeta's externals, the docs and tools left out).
# Run it from the Actions tab; the run's log lists every file that would ship (the packager
# removes its release folder after a run that doesn't upload).
name: Package (dry run)

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package without uploading
        uses: BigWigsMods/packager@v2
        with:
          args: -d

